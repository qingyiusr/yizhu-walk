<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>義起走讀</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap">
<style>
/* Layout: 模式 C。首頁選路線後進入一整張義竹地圖（依真實座標），三條路線和各路線同學都在圖上；
   下方面板顯示下一站、距離與集章按鈕。米白紙底、粉彩色票、拼圖小怪獸。刻意採單一明亮主題，與海報一致。 */
:root{
  --white:#FFFFFF; --ink:#2A2B3D; --muted:#646680; --line:#E4DED3;
  --yellow:#F5D875; --paper:#F2EEE6; --pink:#F3AFB0; --coral:#EE7E7B; --violet:#6E7DBB; --sky:#8FCDEB; --blue:#5DB6DE; --orange:#F2A146;
  --ok:#3E9B6E; --bad:#C2453F; --land:#ECE6D2;
  --font:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html{background:var(--paper)}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.75}
img{max-width:100%}
[hidden]{display:none!important}
a{color:inherit}
:focus-visible{outline:3px solid var(--violet);outline-offset:2px;border-radius:8px}
h1,h2,h3{font-weight:900;text-wrap:balance;margin:0;line-height:1.3}
h2{font-size:24px;display:flex;align-items:center}
h2::before{content:"";width:14px;height:14px;border-radius:50%;background:var(--orange);box-shadow:20px 0 0 var(--yellow);margin-right:32px;flex:none}
h3{font-size:19px}
p{margin:0}
button{font:inherit;cursor:pointer}

.wrap{max-width:720px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 40px}
body.on-map .wrap{max-width:none;padding-bottom:0}
body.on-map footer{display:none}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:12px}
body.on-map .topbar{max-width:720px;margin-inline:auto;margin-bottom:10px}
.brand{font-weight:900;font-size:20px;text-decoration:none;letter-spacing:.04em}
.brand b{color:var(--coral)}
.nav{display:flex;gap:6px;flex-wrap:wrap}
.nav a{font-size:14px;font-weight:700;text-decoration:none;padding:4px 12px;border-radius:999px;background:var(--white);border:1px solid var(--line)}
.nav a[aria-current="page"]{background:var(--ink);color:var(--white);border-color:var(--ink)}
.nav a[href="#test"]{background:var(--yellow);border-color:var(--ink);font-weight:900}
.lead{color:var(--muted);max-width:36em}
.eyebrow{font-size:13px;font-weight:700;letter-spacing:.14em;color:var(--muted)}
.small{font-size:14px;color:var(--muted)}
.stack{display:flex;flex-direction:column;gap:14px}
section{margin-top:36px}
.btn{border:0;border-radius:999px;padding:13px 26px;font-weight:900;font-size:18px;background:var(--orange);color:var(--white);text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn:disabled{background:#E2DDD3;color:#8B8C9C;cursor:not-allowed}
.btn.ghost{background:var(--white);color:var(--ink);box-shadow:0 0 0 2px var(--line) inset}
.linkbtn{border:0;background:none;padding:0;font-weight:700;font-size:14px;color:var(--muted);text-decoration:underline;text-underline-offset:3px}

/* ---------- 載入動畫 ---------- */
#loader{position:fixed;inset:0;z-index:100;background:var(--paper);display:grid;place-items:center;transition:opacity .45s}
#loader.out{opacity:0;pointer-events:none}
.ld{display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center}
.ld .mon{width:120px;height:auto}
.ld .title{font-size:44px;font-weight:900;line-height:1.05}
.ld .title span{color:var(--coral)}
.ld .bars{display:flex;flex-direction:column;gap:7px;width:180px}
.ld .bars i{display:block;height:8px;border-radius:4px;background:var(--line);overflow:hidden;position:relative}
.ld .bars i::after{content:"";position:absolute;inset:0;background:var(--c);transform-origin:left}
.ld .msg{font-size:14px;font-weight:700;color:var(--muted);letter-spacing:.2em}
@media (prefers-reduced-motion:no-preference){
  .ld .mon{animation:hop .7s ease-in-out infinite alternate}
  .ld .bars i::after{animation:fill 1.3s cubic-bezier(.6,.1,.3,1) both}
  .ld .bars i:nth-child(2)::after{animation-delay:.2s} .ld .bars i:nth-child(3)::after{animation-delay:.4s}
  @keyframes hop{from{transform:translateY(0) rotate(-4deg)}to{transform:translateY(-16px) rotate(4deg)}}
  @keyframes fill{from{transform:scaleX(0)}to{transform:scaleX(1)}}
}

/* ---------- 主視覺 ---------- */
.hello{display:flex;flex-direction:column;gap:2px;padding-top:4px}
.hello h1{font-size:clamp(30px,8vw,44px);line-height:1.2}
section.first{margin-top:16px}
.kv{position:relative;overflow:hidden;border-radius:6px;background:var(--paper);border:1px solid var(--line);
  padding-top:clamp(26px,6vw,44px);padding-inline:clamp(20px,5vw,40px);display:flex;flex-direction:column;align-items:flex-start;gap:10px;isolation:isolate}
.kv .cmon{position:absolute;top:0;right:0;width:clamp(90px,20vw,160px);height:auto;z-index:-1}
.kv .tag{background:var(--coral);color:var(--white);font-weight:700;border-radius:999px;padding:4px 16px;font-size:clamp(12px,3vw,15px);letter-spacing:.1em}
.kv h1{font-size:clamp(78px,20vw,150px);line-height:.98;letter-spacing:-.03em;margin-left:-.04em}
.kv h1 .l1{color:var(--coral);display:block}
.kv h1 .bang{color:var(--orange)}
.kv .sub{font-weight:900;font-size:clamp(18px,4.6vw,28px);letter-spacing:.06em}
.kv .sub em{font-style:normal;color:var(--violet);font-size:.8em}
.kv .when{font-weight:900;color:var(--orange);font-size:clamp(18px,4.6vw,26px);font-variant-numeric:tabular-nums}
.kv .metro{width:calc(100% + 2*clamp(20px,5vw,40px));margin-inline:calc(-1*clamp(20px,5vw,40px));display:block;height:auto}

/* ---------- 選路線：3D 路線車票 ---------- */
.deck{position:relative;height:clamp(430px,118vw,470px);perspective:1100px;perspective-origin:50% 40%;margin-inline:-16px;overflow:hidden;touch-action:pan-y;user-select:none;-webkit-user-select:none}
.deck .track{position:absolute;inset:0;transform-style:preserve-3d}
.tk{position:absolute;left:50%;top:14px;width:min(74vw,290px);margin-left:calc(min(74vw,290px)/-2);height:clamp(380px,104vw,416px);
  background:#FFFDF8;color:var(--ink);border-radius:10px;display:flex;flex-direction:column;text-align:left;padding:0;border:0;font:inherit;cursor:pointer;
  box-shadow:0 1px 0 rgba(0,0,0,.05),0 18px 30px -18px rgba(42,43,61,.45);transform-origin:50% 60%;will-change:transform;backface-visibility:hidden}
.tk::before{content:"";position:absolute;inset:0;border-radius:10px;pointer-events:none;
  background:repeating-linear-gradient(0deg,rgba(42,43,61,.018) 0 2px,transparent 2px 4px)}
.tk .band{background:var(--rc);color:#fff;border-radius:10px 10px 0 0;padding:10px 16px 9px;display:flex;justify-content:space-between;align-items:baseline;font-weight:900;letter-spacing:.12em}
.tk .band small{font-size:11px;letter-spacing:.18em;opacity:.85}
.tk .band span{font-size:17px}
.tk .ttl{padding:10px 16px 0;font-weight:900;font-size:22px;line-height:1.25}
.tk svg{display:block;width:100%;height:auto;margin:2px 0 0}
.tk ol{list-style:none;margin:0;padding:0 16px;display:grid;gap:1px;font-size:13.5px;font-weight:700;counter-reset:s}
.tk ol li{display:flex;gap:8px;align-items:center}
.tk ol li::before{counter-increment:s;content:counter(s);flex:none;width:18px;height:18px;border-radius:50%;border:2px solid var(--rc);color:var(--rc);font-size:11px;display:grid;place-items:center;line-height:1}
.tk ol li.back::before{content:"";border-radius:3px;background:var(--rc)}
.tk .stub{margin-top:auto;position:relative;border-top:2px dashed var(--line);padding:11px 16px 13px;display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--muted);font-weight:700}
.tk .stub::before,.tk .stub::after{content:"";position:absolute;top:-11px;width:20px;height:20px;border-radius:50%;background:var(--paper)}
.tk .stub::before{left:-10px}.tk .stub::after{right:-10px}
.tk .stub b{color:var(--ink);font-size:14px}
.tk .slot{width:66px;height:66px;border-radius:50%;border:2px dashed var(--line);display:grid;place-items:center;font-size:11px;color:var(--muted);text-align:center;line-height:1.3;position:relative}
.tk .tkseal{position:absolute;inset:-6px;border-radius:50%;border:3px solid var(--rc);color:var(--rc);display:grid;place-items:center;font-weight:900;font-size:17px;letter-spacing:.06em;
  transform:rotate(-14deg);opacity:0;background:radial-gradient(circle,transparent 58%,rgba(255,255,255,.0) 60%);mix-blend-mode:multiply}
.tk .tkseal::after{content:"";position:absolute;inset:4px;border-radius:50%;border:1.5px solid var(--rc)}
.tk[aria-checked="true"] .tkseal{opacity:.92}
.tk[aria-checked="true"] .slot{border-color:transparent;color:transparent}
.deck .shadow{position:absolute;left:50%;bottom:6px;width:62%;height:18px;margin-left:-31%;border-radius:50%;background:radial-gradient(rgba(42,43,61,.22),transparent 70%)}
.deckctl{display:flex;justify-content:center;align-items:center;gap:14px;margin-top:-4px}
.deckctl button{width:42px;height:42px;border-radius:50%;border:2px solid var(--ink);background:var(--white);color:var(--ink);font-size:18px;font-weight:900;display:grid;place-items:center;cursor:pointer}
.deckctl .dots{display:flex;gap:8px}
.deckctl .dots i{width:9px;height:9px;border-radius:50%;background:var(--line);transition:background .2s,transform .2s}
.deckctl .dots i.on{background:var(--ink);transform:scale(1.25)}
.deckhint{text-align:center;font-size:13px;color:var(--muted);margin:6px 0 0}
@media (prefers-reduced-motion:no-preference){
  .tk{transition:transform .55s cubic-bezier(.2,.8,.25,1),opacity .4s,filter .4s}
  .deck.drag .tk{transition:none}
  .tk[aria-checked="true"] .tkseal{animation:thunk .42s cubic-bezier(.3,1.6,.5,1) both}
  @keyframes thunk{0%{transform:rotate(-14deg) scale(1.9);opacity:0}60%{opacity:1}100%{transform:rotate(-14deg) scale(1);opacity:.92}}
}
.pick{display:grid;gap:12px}
.rcard{position:relative;display:flex;gap:14px;align-items:center;background:var(--white);border:3px solid var(--line);border-radius:20px;padding:14px 46px 14px 16px;text-align:left;width:100%;color:var(--ink)}
.rcard .num{flex:none;width:54px;height:54px;border-radius:16px;background:var(--rc);color:var(--white);display:grid;place-items:center;font-weight:900;font-size:26px}
.rcard b{display:block;font-size:19px;font-weight:900}
.rcard .stops{font-size:13px;color:var(--muted);line-height:1.5;display:block}
.rcard[aria-checked="true"]{border-color:var(--rc);box-shadow:0 0 0 3px var(--rc) inset}
.rcard[aria-checked="true"]::after{content:"✓";position:absolute;right:14px;top:12px;width:28px;height:28px;border-radius:50%;background:var(--rc);color:#fff;display:grid;place-items:center;font-weight:900}
.form{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.form label{display:flex;flex-direction:column;gap:4px;font-weight:700;font-size:15px;min-width:0}
.form input,.code input{font:inherit;padding:11px 14px;border-radius:14px;border:2px solid var(--line);background:var(--white);width:100%}
.form input:focus,.code input:focus{border-color:var(--violet);outline:none}
@media (max-width:420px){.form{grid-template-columns:1fr}}
.hint{font-size:13px;color:var(--muted)}
.err{color:var(--bad);font-weight:700;font-size:14px}

/* ---------- 大地圖 ---------- */
.mapview{position:relative;height:calc(100dvh - 110px);min-height:480px;
  margin-left:calc(-1*max(16px,env(safe-area-inset-left,0px)));margin-right:calc(-1*max(16px,env(safe-area-inset-right,0px)));overflow:hidden;background:var(--land);border-top:1px solid var(--line)}
#map{position:absolute;inset:0;width:100%;height:100%;touch-action:none;cursor:grab;user-select:none;-webkit-user-select:none;font-family:var(--font)}
#map:active{cursor:grabbing}
.mtop{position:absolute;top:10px;left:max(12px,env(safe-area-inset-left,0px));right:max(12px,env(safe-area-inset-right,0px));display:flex;gap:6px;flex-wrap:wrap;align-items:center;pointer-events:none}
.mtop>*{pointer-events:auto}
.mchip{border:0;font-size:12px;font-weight:900;padding:5px 12px;border-radius:999px;background:var(--white);color:var(--ink);box-shadow:0 1px 4px rgba(0,0,0,.14)}
.mchip[aria-pressed="true"]{background:var(--ink);color:var(--white)}
.live{margin-left:auto;display:flex;align-items:center;gap:6px;font-size:11px;font-weight:900;background:var(--white);padding:4px 10px;border-radius:999px;box-shadow:0 1px 4px rgba(0,0,0,.14)}
.live i{width:8px;height:8px;border-radius:50%;background:var(--ok)}
.live.demo i{background:var(--orange)}
.mctl{position:absolute;right:max(12px,env(safe-area-inset-right,0px));top:52px;display:flex;flex-direction:column;gap:6px}
.mctl button{width:40px;height:40px;border:0;border-radius:12px;background:var(--white);box-shadow:0 1px 4px rgba(0,0,0,.16);font-weight:900;font-size:18px;color:var(--ink);display:grid;place-items:center}
.mctl svg{width:20px;height:20px}
.mtop,.mctl{z-index:3}
.mctl .t3d{font-size:14px;letter-spacing:.02em}
.mapview .haze{position:absolute;left:0;right:0;top:0;height:22%;pointer-events:none;background:linear-gradient(#F6F1E4 0%,rgba(246,241,228,.75) 35%,rgba(246,241,228,0))}
.drow{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.drow .linkbtn{white-space:nowrap}
.oline{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:13px}
.sheet{position:absolute;left:0;right:0;bottom:0;background:var(--white);border-radius:22px 22px 0 0;box-shadow:0 -6px 20px rgba(0,0,0,.14);
  padding:4px max(16px,env(safe-area-inset-right,0px)) calc(14px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));
  max-height:52%;overflow-y:auto;display:flex;flex-direction:column;gap:8px}
.sheet.full{max-height:86%}
.grab{border:0;background:none;align-self:center;padding:6px 30px}
.grab i{display:block;width:42px;height:5px;border-radius:3px;background:var(--line)}
.srow1{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.rtag{font-size:12px;font-weight:900;padding:2px 10px;border-radius:999px;background:var(--rc);color:var(--white);white-space:nowrap}
.pdots{display:flex;gap:4px;margin-left:auto}
.pdots span{width:22px;height:22px;border-radius:50%;border:3px solid var(--rc);display:grid;place-items:center;font-size:11px;font-weight:900;color:var(--rc)}
.pdots span.on{background:var(--rc);color:var(--white)}
.sel{display:flex;flex-direction:column;gap:2px}
.sel h3{font-size:22px;line-height:1.2}
.sel .meta{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.dist{font-size:14px;color:var(--muted)}
.dist b{font-size:20px;color:var(--ink);font-variant-numeric:tabular-nums}
.dist.near b{color:var(--ok)}
.sactions{display:flex;flex-direction:column;gap:8px}
.sactions .btn{width:100%}
.slinks{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.code{display:flex;gap:8px}
.code input{flex:1;min-width:0;padding:9px 12px;font-variant-numeric:tabular-nums;letter-spacing:.2em}
.code .btn{padding:9px 18px;font-size:15px;width:auto}
.others{display:flex;gap:6px;flex-wrap:wrap;font-size:12px}
.others span{display:inline-flex;align-items:center;gap:5px;background:var(--paper);padding:2px 10px;border-radius:999px;font-weight:700}
.others i{width:9px;height:9px;border-radius:50%;flex:none}
.slist{display:flex;flex-direction:column;gap:8px}
.srow{display:flex;align-items:center;gap:12px;background:var(--white);border:2px solid var(--line);border-radius:16px;padding:10px 12px;text-decoration:none;width:100%;text-align:left;color:var(--ink)}
.srow .n{flex:none;width:32px;height:32px;border-radius:50%;border:4px solid var(--rc);display:grid;place-items:center;font-weight:900;font-size:14px;background:var(--white)}
.srow.done .n{background:var(--rc);color:var(--white)}
.srow.next{border-color:var(--rc)}
.srow .t{flex:1;min-width:0}
.srow .t b{display:block;font-size:16px}
.state{font-size:12px;font-weight:900;padding:2px 10px;border-radius:999px;background:#F1EEE8;white-space:nowrap}
.srow.next .state{background:var(--rc);color:var(--white)}
.reward{background:var(--yellow);color:var(--ink);border-radius:18px;padding:14px 16px;font-weight:700}
.reward b{display:block;font-size:22px;font-weight:900}
.reward small{display:block;font-weight:500;color:#5A5C70;margin-top:4px}
.notice{font-size:13px;font-weight:700;background:#FFF4DA;border-radius:12px;padding:8px 12px}
.notice.bad{background:#FBE3E1;color:var(--bad)}

/* ---------- 地點 ---------- */
.spot-hero{display:flex;flex-direction:column;gap:8px;background:var(--rc);color:#fff;border-block:3px solid var(--ink);
  margin-left:calc(-1*max(16px,env(safe-area-inset-left,0px)));margin-right:calc(-1*max(16px,env(safe-area-inset-right,0px)));
  padding-block:18px 22px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.spot-hero h1{font-size:clamp(38px,10vw,58px);color:#fff;line-height:1.1}
.spot-hero .eyebrow,.spot-hero .lead{color:#fff;opacity:.92}
.spot-hero .chip{background:#fff;color:var(--ink)}
.spot-hero .draft{background:transparent;color:#fff;border-color:rgba(255,255,255,.7)}
.chips{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.chip{font-size:13px;font-weight:700;padding:3px 12px;border-radius:999px;background:#ECE8E0;display:inline-flex;align-items:center;gap:6px}
.type{background:var(--white);border:2px solid var(--tc)}
.type::before{content:"";width:10px;height:10px;border-radius:50%;background:var(--tc)}
.draft{border:2px dashed #C9C4BD;background:transparent;color:var(--muted)}
.photo{aspect-ratio:4/3;width:100%;max-height:360px;border-radius:20px;overflow:hidden;background:radial-gradient(circle,#E8E1D2 3px,transparent 3.5px) 0 0/22px 22px,var(--white);display:grid;place-items:center;color:var(--muted);font-weight:700}
.photo{margin:0;position:relative}
.photo img{width:100%;height:100%;object-fit:cover;display:block}
.photo .ph0{display:none}.photo.none .ph0{display:block}
.photo figcaption{position:absolute;right:0;bottom:0;font-size:11px;background:rgba(247,245,240,.88);color:var(--ink);padding:2px 8px;border-radius:3px 0 0 0}
.block{background:var(--white);border:1px solid var(--line);border-radius:20px;padding:16px 18px;display:flex;flex-direction:column;gap:8px}
.block ul{margin:0;padding-left:1.2em;display:flex;flex-direction:column;gap:6px}
.mission{border:2px solid var(--rc)}
.mission h3{color:var(--rc)}
.elder{background:#EAF4FA;border-color:transparent}
.stampbox{background:var(--ink);color:var(--white);border-radius:22px;padding:18px;display:flex;flex-direction:column;gap:10px}
.stampbox .dist,.stampbox .linkbtn,.stampbox .small{color:#C8C9D6}
.stampbox .dist b{color:var(--white)}
.stampbox .dist.near b{color:#8EE0B5}
.stampbox .btn:disabled{background:#45475C;color:#A5A6B8}
.sources{font-size:14px;color:var(--muted)}
.sources ul{padding-left:1.2em;margin:4px 0 0}
.sources a{word-break:break-all}
.pager{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.pager a{text-decoration:none;font-weight:700;padding:8px 16px;border-radius:999px;background:var(--white);border:1px solid var(--line);font-size:15px}

/* ---------- 照片 ---------- */
.up{border:2px dashed var(--rc)}
.up-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.pick-photo{position:relative;overflow:hidden;background:var(--rc)}
.pick-photo input{position:absolute;inset:0;opacity:0;cursor:pointer}
.thumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:8px}
.th{position:relative;aspect-ratio:1;max-width:100%;border-radius:12px;overflow:hidden;background:#EEE}
.th img{width:100%;height:100%;object-fit:cover;display:block}
.th .st{position:absolute;left:4px;bottom:4px;font-size:11px;font-weight:900;padding:1px 7px;border-radius:999px;background:var(--white)}

  var CMON="<svg class=\"cmon\" viewBox=\"1110 0 304 380\" aria-hidden=\"true\"><g id=\"corner-monster\"><path fill=\"#FFE800\" d=\"M1414 0V335C1350 372 1268 338 1236 272C1176 262 1118 210 1140 146C1098 96 1126 24 1170 0Z\"/><circle cx=\"1262\" cy=\"176\" r=\"26\" fill=\"#FFFFFF\"/><circle cx=\"1255\" cy=\"182\" r=\"13\" fill=\"#22386B\"/><circle cx=\"1336\" cy=\"158\" r=\"30\" fill=\"#FFFFFF\"/><circle cx=\"1328\" cy=\"165\" r=\"15\" fill=\"#22386B\"/><path d=\"M1282 236Q1300 254 1320 236\" fill=\"none\" stroke=\"#22386B\" stroke-width=\"8\" stroke-linecap=\"round\"/></g></svg>";
  var MINI='<g class="mon-bob"><path fill="#FF48B0" opacity=".8" transform="translate(2.6 2)" d="M-18 -40H-7C-4 -40 -4 -42 -5 -44C-6 -48 -3 -51 0 -51C3 -51 6 -48 5 -44C4 -42 4 -40 7 -40H18A6 6 0 0 1 24 -34V-6A6 6 0 0 1 18 0H-18A6 6 0 0 1 -24 -6V-14C-24 -17 -22 -18 -20 -17.5C-18 -17 -16 -19 -16 -22C-16 -25 -18 -27 -20 -26.5C-22 -26 -24 -27 -24 -30V-34A6 6 0 0 1 -18 -40Z"/><path fill="#0078BF" d="M-18 -40H-7C-4 -40 -4 -42 -5 -44C-6 -48 -3 -51 0 -51C3 -51 6 -48 5 -44C4 -42 4 -40 7 -40H18A6 6 0 0 1 24 -34V-6A6 6 0 0 1 18 0H-18A6 6 0 0 1 -24 -6V-14C-24 -17 -22 -18 -20 -17.5C-18 -17 -16 -19 -16 -22C-16 -25 -18 -27 -20 -26.5C-22 -26 -24 -27 -24 -30V-34A6 6 0 0 1 -18 -40Z"/><circle cx="-6" cy="-25" r="4.4" fill="#fff"/><circle cx="-7" cy="-26" r="2.2" fill="#22386B"/><circle cx="10" cy="-25.5" r="5" fill="#fff"/><circle cx="9" cy="-26.5" r="2.5" fill="#22386B"/><path fill="#22386B" d="M-5 -14Q3 -16 12 -14Q12 -6 3.5 -5Q-5 -5 -5 -14Z"/></g>';

      '<path fill="#EE7E7B" d="M142 236Q166 216 194 234Q180 242 166 242Q152 242 142 236Z"/></svg>';
  }

  /* ================= 定位 ================= */
  var geo={state:'idle',lat:null,lng:null,acc:null,ts:0,watch:null};
  function dist(a,b,c,d){var R0=6371000,t=Math.PI/180,x=(c-a)*t,y=(d-b)*t,h=Math.sin(x/2)*Math.sin(x/2)+Math.cos(a*t)*Math.cos(c*t)*Math.sin(y/2)*Math.sin(y/2);return 2*R0*Math.asin(Math.sqrt(h))}
  function startGeo(){
    if(!('geolocation' in navigator)){geo.state='none';onGeo();return}
    if(geo.watch!=null) return;
    if(geo.state!=='ok') geo.state='wait';
    try{
      geo.watch=navigator.geolocation.watchPosition(function(p){
        geo.state='ok';geo.lat=p.coords.latitude;geo.lng=p.coords.longitude;geo.acc=p.coords.accuracy;geo.ts=Date.now();onGeo();
      },function(e){
        /* 被拒絕就停；暫時抓不到（訊號差、逾時）時保留上一次的位置，2 秒後自動重試 */
        try{navigator.geolocation.clearWatch(geo.watch)}catch(_){}geo.watch=null;
        if(e.code===1){geo.state='denied'}
        else{if(!(geo.lat!=null&&Date.now()-geo.ts<90000))geo.state='fail';setTimeout(startGeo,2000)}
        onGeo();
      },{enableHighAccuracy:true,maximumAge:5000,timeout:20000});
    }catch(e){geo.state='fail';onGeo()}
  }
  function spotDistance(id){if(geo.state!=='ok')return null;var p=P[id];return dist(geo.lat,geo.lng,p.lat,p.lng)}
  /* 允許扣掉一部分定位誤差（最多 40 公尺），避免站在門口卻集不到章 */
  function canStamp(id){var d=spotDistance(id);if(d==null)return false;return d-Math.min(geo.acc||0,40)<=S.stampRadius}
  var geoListeners=[];
  function onGeo(){geoListeners.forEach(function(f){f()})}

  /* ================= 導覽列 ================= */

    if(TEST&&TEST.lat) items=[['test','測試中']].concat(items.filter(function(x){return x[0]!==''&&x[0]!=='cards'}));

      return '<a href="#'+it[0]+'"'+(cur===it[0]?' aria-current="page"':'')+'>'+it[1]+'</a>'}).join('');
  }

  /* ================= 首頁：選路線 ================= */
  var chosen=null;
  function home(){
    chosen=profile?profile.route:null;
    var h='<div class="hello"><p class="eyebrow">義竹國中 × 青銀搖滾力</p><h1>你走的是哪一條路線？</h1></div>';
    h+='<section class="first"><div class="deck" id="deck"><div class="shadow"></div><div class="track" role="radiogroup" aria-label="選擇路線">';
    R.forEach(function(r,i){
      h+='<button type="button" class="tk" role="radio" aria-checked="'+(chosen===r.id)+'" data-r="'+r.id+'" data-i="'+i+'" style="--rc:'+r.color+'">'+
        '<span class="band"><span>路線 '+NUM[i]+'</span><small>ROUTE 0'+(i+1)+'</small></span>'+
        '<span class="ttl">'+esc(r.name.replace(/^路線.\s*/,''))+'</span>'+ticketLine(r)+
        '<ol>'+r.stops.map(function(s){return '<li>'+esc(P[s].name)+'</li>'}).join('')+'<li class="back">回集合點</li></ol>'+
        '<span class="stub"><span>義起走讀！<br><b>'+esc(S.date||'')+'</b></span><span class="slot">點這張<br>選路線<span class="tkseal">出發</span></span></span></button>';
    });
    h+='</div></div><div class="deckctl"><button type="button" id="dk-prev" aria-label="上一條路線">‹</button><span class="dots">'+R.map(function(){return '<i></i>'}).join('')+'</span><button type="button" id="dk-next" aria-label="下一條路線">›</button></div>'+
      '<p class="deckhint">左右滑動看路線，點一下車票就能選定</p>';
    h+='</section>';
    /* 選好路線後才從下方滑出的填名字視窗 */

      '<p class="small">最後一步：寫下你的名字。照片會存進你自己的資料夾，地圖上其他同學只會看到你的名字，看不到班級座號。</p>'+
      '<div class="form"><label for="f-cls">班級座號<input id="f-cls" inputmode="numeric" autocomplete="off" placeholder="例如 80105" value="'+esc(profile?profile.cls:'')+'"></label>'+

    return h;
  }
  /* 車票上的路線走向：用真實座標畫，集合點→三站→回集合點 */
  function ticketLine(r){
    var W=290,H=118,pad=20;
    var st=r.stops.map(function(s){return xy(P[s].lat,P[s].lng)});
    /* 集合點離站點很遠，按方向拉近，讓三站不會擠成一團 */
    var cx=0,cy=0;st.forEach(function(p){cx+=p[0]/st.length;cy+=p[1]/st.length});
    var mp=xy(M.lat,M.lng),vx=mp[0]-cx,vy=mp[1]-cy,vd=Math.hypot(vx,vy)||1;
    var sp=Math.max.apply(null,st.map(function(p){return Math.hypot(p[0]-cx,p[1]-cy)}))||60, md=Math.min(vd,sp*1.7+40);
    var pts=[[cx+vx/vd*md,cy+vy/vd*md]].concat(st);
    var xs=pts.map(function(p){return p[0]}),ys=pts.map(function(p){return p[1]});
    var x0=Math.min.apply(null,xs),x1=Math.max.apply(null,xs),y0=Math.min.apply(null,ys),y1=Math.max.apply(null,ys);
    var k=Math.min((W-2*pad)/Math.max(x1-x0,1),(H-2*pad)/Math.max(y1-y0,1));
    var ox=(W-(x1-x0)*k)/2, oy=(H-(y1-y0)*k)/2;
    var q=pts.map(function(p){return [ox+(p[0]-x0)*k,oy+(p[1]-y0)*k]});
    for(var it=0;it<30;it++)for(var a=0;a<q.length;a++)for(var b=a+1;b<q.length;b++){
      var dx=q[b][0]-q[a][0],dy=q[b][1]-q[a][1],dd=Math.hypot(dx,dy)||.01;
      if(dd<26){var m=(26-dd)/2;q[a][0]-=dx/dd*m;q[a][1]-=dy/dd*m;q[b][0]+=dx/dd*m;q[b][1]+=dy/dd*m}}
    q=q.map(function(p){return [Math.max(14,Math.min(W-14,p[0])).toFixed(1),Math.max(13,Math.min(H-13,p[1])).toFixed(1)]});
    var d='M'+q.concat([q[0]]).map(function(p){return p.join(' ')}).join('L');
    var s='<svg viewBox="0 0 '+W+' '+H+'" aria-hidden="true"><defs><pattern id="tg" width="12" height="12" patternUnits="userSpaceOnUse"><circle cx="1.5" cy="1.5" r="1" fill="#0078BF" opacity=".18"/></pattern></defs>'+
      '<rect x="12" y="4" width="'+(W-24)+'" height="'+(H-8)+'" rx="6" fill="url(#tg)"/>'+
      '<path d="'+d+'" fill="none" stroke="'+r.color+'" stroke-width="7" stroke-linejoin="round" stroke-linecap="round" style="mix-blend-mode:multiply"/>'+
      '<path d="'+d+'" transform="translate(2.5 2)" fill="none" stroke="#0078BF" stroke-width="1.8" stroke-linejoin="round" opacity=".6"/>';
    s+='<rect x="'+(q[0][0]-11)+'" y="'+(q[0][1]-11)+'" width="22" height="22" rx="4" fill="#FFE800"/><text x="'+q[0][0]+'" y="'+(+q[0][1]+4.5)+'" text-anchor="middle" font-size="12" font-weight="900" fill="#0078BF">集</text>';
    for(var i=1;i<q.length;i++) s+='<circle cx="'+q[i][0]+'" cy="'+q[i][1]+'" r="10" fill="#0078BF"/><text x="'+q[i][0]+'" y="'+(+q[i][1]+4.2)+'" text-anchor="middle" font-size="12" font-weight="900" fill="#fff">'+i+'</text>';
    return s+'</svg>';
  }
  function bindHome(){
    var deck=document.getElementById('deck'), cards=[].slice.call(deck.querySelectorAll('.tk')), dots=[].slice.call(app.querySelectorAll('.deckctl .dots i'));
    var n=cards.length, idx=Math.max(0,R.map(function(r){return r.id}).indexOf(chosen)), drag=0;
    function lay(){
      var w=cards[0].offsetWidth||280;
      cards.forEach(function(c,i){
        var d=i-idx+drag, a=Math.abs(d);

  function animateMon(){
    var r=myRoute(), from=monPos[r.id]==null?0:monPos[r.id], to=target(r);
    if(from>to) from=to;
    var reduce=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
    if(from===to||reduce){var q=nodeXY(r,to);placeMon(q[0],q[1]);monPos[r.id]=to;store('yizhu-walk-monpos',monPos);return}
    var seg=from;
    (function run(){
      if(seg>=to){var pts=r.stops.map(function(x){return xy(P[x].lat,P[x].lng)});if(to>r.stops.length)pts.push(xy(M.lat,M.lng));focusOn(pts,110);return}
      var a=nodeXY(r,seg),b=nodeXY(r,seg+1),t0=null,dur=1500;
      focusOn([a,b],160);
      function step(ts){
        if(!document.getElementById('mon')) return;
        if(t0==null)t0=ts;var k=Math.min(1,(ts-t0)/dur),e=k<.5?2*k*k:1-Math.pow(-2*k+2,2)/2;

      }
      requestAnimationFrame(step);
    })();
  }

  /* 地圖平移與縮放 */
  function svgEl(){return document.getElementById('map')}
  function setView(v){view=v;var s=svgEl();if(s)s.setAttribute('viewBox',v.x.toFixed(1)+' '+v.y.toFixed(1)+' '+v.w.toFixed(1)+' '+v.h.toFixed(1))}
  function focusOn(pts,pad){
    pad=pad||120;var s=svgEl();if(!s)return;pts=pts.map(pj);if(V3)pts=pts.concat(pts.map(function(p){return [p[0],p[1]-70]}));var b=s.getBoundingClientRect(),sh=document.getElementById('sheet');
    var top=56/b.height, bottom=sh?Math.min(.6,sh.getBoundingClientRect().height/b.height):0, useH=1-top-bottom;
    var xs=pts.map(function(p){return p[0]}),ys=pts.map(function(p){return p[1]});
    var x0=Math.min.apply(null,xs)-pad*1.5,x1=Math.max.apply(null,xs)+pad*1.5,y0=Math.min.apply(null,ys)-pad,y1=Math.max.apply(null,ys)+pad;
    var w=x1-x0,h=y1-y0,ar=b.height/b.width;
    if(h>w*ar*useH){var nw=h/(ar*useH);x0-=(nw-w)/2;w=nw}
    var H=w*ar, vy=y0-H*top-((H*useH)-h)/2;
    setView({x:x0,y:vy,w:w,h:H});
  }
  function zoom(f,cx,cy){
    if(!view)return;var w=Math.max(200,Math.min(5000,view.w*f));f=w/view.w;
    cx=cx==null?view.x+view.w/2:cx;cy=cy==null?view.y+view.h/2:cy;
    setView({x:cx-(cx-view.x)*f,y:cy-(cy-view.y)*f,w:view.w*f,h:view.h*f});
  }
  var dragMoved=false;
  function bindPanZoom(){
    var s=svgEl(),pts={},last=null,lastD=null;
    function toMap(cx,cy){var b=s.getBoundingClientRect();return [view.x+(cx-b.left)/b.width*view.w,view.y+(cy-b.top)/b.height*view.h]}
    s.addEventListener('pointerdown',function(e){pts[e.pointerId]={x:e.clientX,y:e.clientY};dragMoved=false;last=null;lastD=null});
    s.addEventListener('pointermove',function(e){
      if(!pts[e.pointerId])return;pts[e.pointerId]={x:e.clientX,y:e.clientY};
      var ids=Object.keys(pts),b=s.getBoundingClientRect();
      if(ids.length===1){var p=pts[ids[0]];if(last){var mx=p.x-last.x,my=p.y-last.y;if(Math.abs(mx)+Math.abs(my)>2)dragMoved=true;
        if(dragMoved)setView({x:view.x-mx/b.width*view.w,y:view.y-my/b.height*view.h,w:view.w,h:view.h})}last={x:p.x,y:p.y}}
      else if(ids.length===2){var a=pts[ids[0]],c=pts[ids[1]],d=Math.hypot(a.x-c.x,a.y-c.y),mid=toMap((a.x+c.x)/2,(a.y+c.y)/2);if(lastD){zoom(lastD/d,mid[0],mid[1]);dragMoved=true}lastD=d;last=null}
    });
    function up(e){delete pts[e.pointerId];last=null;lastD=null}
    s.addEventListener('pointerup',up);s.addEventListener('pointercancel',up);s.addEventListener('pointerleave',up);
    s.addEventListener('wheel',function(e){e.preventDefault();var m=toMap(e.clientX,e.clientY);zoom(e.deltaY>0?1.15:1/1.15,m[0],m[1])},{passive:false});

  /* ================= 照片處理 ================= */
  function resize(file,max,q){
    return new Promise(function(res,rej){
      var url=URL.createObjectURL(file), img=new Image();
      img.onload=function(){var s=Math.min(1,max/Math.max(img.width,img.height)),c=document.createElement('canvas');
        c.width=Math.round(img.width*s);c.height=Math.round(img.height*s);c.getContext('2d').drawImage(img,0,0,c.width,c.height);
        URL.revokeObjectURL(url);res(c.toDataURL('image/jpeg',q))};
      img.onerror=function(){URL.revokeObjectURL(url);rej()};
      img.src=url;
    });
  }
  function addPhotos(id,files,after){
    if(!profile) return;
    var list=photos[id]||(photos[id]=[]);
    var room=S.maxPhotos-list.length, arr=Array.prototype.slice.call(files,0,Math.max(0,room));
    if(!arr.length){note('這一站最多 '+S.maxPhotos+' 張照片。');return}
    arr.forEach(function(file){
      Promise.all([resize(file,1600,.85),resize(file,240,.7)]).then(function(out){
        var ph={id:Date.now().toString(36)+Math.random().toString(36).slice(2,6),thumb:out[1],status:S.uploadUrl?'up':'local',ts:Date.now()};
        full[ph.id]=out[0]; list.push(ph);
        if(!store('yizhu-walk-photos',photos)){ph.thumb='';store('yizhu-walk-photos',photos)}
        refreshThumbs(id); if(after) after(ph);
        var rt=routeOf(id);
        ph.fn=P[id].name+'_'+new Date(ph.ts).toISOString().replace(/[:.]/g,'-')+'.jpg'; ph.route=rt.name; store('yizhu-walk-photos',photos);
        queue({kind:'photo',spot:id,phId:ph.id,body:{type:'photo',key:S.uploadKey,routeId:rt.id,route:rt.name,student:profile.cls+'_'+profile.name,
          spotId:id,spot:P[id].name,filename:ph.fn,data:out[0].split(',')[1]}});
      }).catch(function(){note('這張照片讀不出來，請換一張試試。')});
    });
  }
  /* 刪除照片：從手機移除、取消還沒送出的上傳；已上傳的請雲端移到垃圾桶 */
  function deletePhoto(spotId,phId){
    var list=photos[spotId]||[], ph=list.filter(function(x){return x.id===phId})[0]; if(!ph) return;
    photos[spotId]=list.filter(function(x){return x.id!==phId}); delete full[phId]; store('yizhu-walk-photos',photos);
    allQueued().then(function(l){return Promise.all((l||[]).filter(function(it){return it.kind==='photo'&&it.phId===phId}).map(function(it){return removeQ(it.qid)}))}).then(function(){
      if(S.uploadUrl&&profile&&ph.fn&&ph.status!=='local')
        queue({kind:'del',body:{type:'delete',key:S.uploadKey,route:ph.route||routeOf(spotId).name,student:profile.cls+'_'+profile.name,filename:ph.fn}});
      updatePending();
    });

  /* ================= 上傳佇列：先存在手機（IndexedDB），有網路時依序送出，失敗就等下次補傳 ================= */
  var dbp=null, pendingCount=0, flushing=false, memQ=[];
  function db(){
    if(!dbp) dbp=new Promise(function(res,rej){try{var r=indexedDB.open('yizhu-walk',1);r.onupgradeneeded=function(){r.result.createObjectStore('q',{keyPath:'qid'})};r.onsuccess=function(){res(r.result)};r.onerror=function(){rej()}}catch(e){rej()}});
    return dbp;
  }
  function tx(mode,fn){return db().then(function(d){return new Promise(function(res,rej){var t=d.transaction('q',mode),req=fn(t.objectStore('q'));t.oncomplete=function(){res(req&&req.result)};t.onerror=function(){rej()}})})}
  function queue(item){
    if(!S.uploadUrl) return;
    item.qid=Date.now().toString(36)+Math.random().toString(36).slice(2,7);
    tx('readwrite',function(s){return s.put(item)}).catch(function(){memQ.push(item)}).then(function(){updatePending();flush()});
  }
  function allQueued(){
    return tx('readonly',function(s){return s.getAll()}).catch(function(){return []}).then(function(l){l=l||[];
      return l.concat(memQ.filter(function(m){return !l.some(function(x){return x.qid===m.qid})}))});
  }
  function removeQ(qid){memQ=memQ.filter(function(m){return m.qid!==qid});return tx('readwrite',function(s){return s.delete(qid)}).catch(function(){})}
  function setPhotoStatus(spotId,phId,st){var ph=(photos[spotId]||[]).filter(function(x){return x.id===phId})[0];if(ph&&ph.status!==st){ph.status=st;store('yizhu-walk-photos',photos);refreshThumbs(spotId)}}
  function send(body){return fetch(S.uploadUrl,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(body)}).then(function(r){return r.json()}).then(function(j){if(!j||!j.ok)throw new Error('fail');return j})}
  function flush(){
    if(!S.uploadUrl||flushing) return;
    flushing=true;
    allQueued().then(function(list){
      list.sort(function(a,b){if(a.kind!==b.kind&&(a.kind==='stamp'||b.kind==='stamp'))return a.kind==='stamp'?-1:1;return a.qid<b.qid?-1:1});   /* 集章紀錄先送，不會被大張照片卡住 */
      return list.reduce(function(p,item){return p.then(function(stop){
        if(item.kind==='del') return send(item.body).then(function(){return removeQ(item.qid)},function(){
            item.tries=(item.tries||0)+1; return item.tries>=6?removeQ(item.qid):tx('readwrite',function(s){return s.put(item)}).catch(function(){})}).then(function(){return stop});
        if(stop){if(item.kind==='photo')setPhotoStatus(item.spot,item.phId,'wait');return true}
        if(item.kind==='photo') setPhotoStatus(item.spot,item.phId,'up');
        return send(item.body).then(function(){if(item.kind==='photo')setPhotoStatus(item.spot,item.phId,'ok');return removeQ(item.qid).then(function(){return false})})
          .catch(function(){if(item.kind==='photo')setPhotoStatus(item.spot,item.phId,'wait');return true});
      })},Promise.resolve(false));
    }).catch(function(){}).then(function(){flushing=false;updatePending()});
  }
  function updatePending(){allQueued().then(function(l){var n=(l||[]).length;if(n!==pendingCount){pendingCount=n;if(document.getElementById('sheet'))renderSheet()}})}
  window.addEventListener('online',flush);
  setInterval(flush,45000);

        (my&&my.id===rt.id?'<span class="mine">你的路線</span>':'')+'<span class="cnt">'+n+' / '+rt.stops.length+'</span></div>'+
        (rt.summary?'<p class="small">'+esc(rt.summary)+'</p>':'')+'<ol class="dexrow">';
      rt.stops.forEach(function(id,i){var p=P[id],t=S.types[p.type],on=stampTs(id);
        h+='<li><a href="#spot-'+id+'" class="dexc'+(on?' on':'')+'" style="--tc:'+rt.color+'"><span class="dn">'+(i+1)+'</span>'+
          '<span class="da">'+(on?cardArt(id,rt.color):'<b>?</b>')+'</span>'+
          '<span class="dt">'+t.name+'</span><b class="dname">'+esc(p.name)+'</b>'+(on?'':'<small>還沒集章</small>')+'</a></li>';
      });
      h+='</ol></div>';
    });
    return h+'</section>';
  }

  /* ================= 測試頁 ================= */
  function testPage(){
    var on=TEST&&TEST.lat;
    var h='<div class="spot-hero" style="--rc:var(--ink)"><p class="eyebrow">給工作人員</p><h1>測試模式</h1>'+
      '<p class="lead">不用到義竹，也能先確認手機定位、集章、拍照上傳和小怪獸移動是否正常。測試資料和正式資料完全分開。</p></div><section class="stack">';
    if(!on){
      h+='<div class="block"><h3>怎麼測</h3><ul>'+
        '<li>到戶外或窗邊，按下面的按鈕，允許網站使用位置。</li>'+
        '<li>網站會以你現在的位置建立三個測試點：A 就在你腳下，B 在北邊約 90 公尺，C 在東邊約 90 公尺。</li>'+
        '<li>先在 A 按印章集章，再往 B、C 走，看距離數字會不會跟著變小、走到 60 公尺內能不能集章。</li>'+
        '<li>如果已經設定上傳網址，照片和集章紀錄會真的送到雲端，路線名稱是「測試路線」，測完可以直接刪除。</li></ul></div>'+
        '<p class="err" id="t-err" hidden></p><div><button class="btn" id="t-start" type="button">用我現在的位置開始測試</button></div>'+
        '<p class="hint">建議 iPhone 和 Android 各測一支，並且分別用 Safari、Chrome 和 LINE 開啟網站，比較差別。</p>';
    } else {
      var done=R[0].stops.filter(function(x){return stampTs(x)}).length;
      h+='<div class="block"><h3>測試進行中</h3><p>測試中心點：'+TEST.lat.toFixed(5)+', '+TEST.lng.toFixed(5)+'<br>已集章 '+done+' / 3</p>'+
        '<p class="small">定位狀態：<span id="t-geo">'+({ok:'正常',wait:'定位中',denied:'被拒絕',fail:'抓不到',idle:'還沒開始',none:'不支援'}[geo.state])+'</span>'+(geo.acc?'，誤差約 '+Math.round(geo.acc)+' 公尺':'')+'</p></div>'+
        '<div class="stack"><a class="btn" href="#map">回到測試地圖</a><button class="btn ghost" id="t-end" type="button">結束測試，回到正式版</button></div>'+
        '<p class="hint">結束測試會清掉測試的集章和照片紀錄，正式版的資料不受影響。已經上傳到雲端的測試照片要自己到雲端硬碟刪除。</p>';
    }
    return h+'</section>';
  }
  function bindTest(){
    var st=document.getElementById('t-start');
    if(st) st.addEventListener('click',function(){
      var er=document.getElementById('t-err');st.disabled=true;st.textContent='定位中…';
      if(!('geolocation' in navigator)){er.textContent='這支手機不支援定位。';er.hidden=false;return}
      function go(lat,lng){
        try{localStorage.setItem('yizhu-walk-test',JSON.stringify({lat:lat,lng:lng,ts:Date.now()}));
          localStorage.setItem('yizhu-test-profile',JSON.stringify({route:'route-test',cls:'00000',name:'測試員'}));
          localStorage.setItem('yizhu-test-monpos',JSON.stringify({'route-test':0}));}catch(e){}
        location.hash='map';location.reload();
      }
      function fail(msg){st.disabled=false;st.textContent='用我現在的位置開始測試';er.textContent=msg;er.hidden=false}
      /* 用持續定位拿到的第一個位置；20 秒內拿不到就提示 */
      if(geo.state==='ok'&&Date.now()-geo.ts<30000){go(geo.lat,geo.lng);return}
      var t0=Date.now(),done=false;
      geoListeners.push(function(){
        if(done) return;
        if(geo.state==='ok'){done=true;go(geo.lat,geo.lng)}
        else if(geo.state==='denied'){done=true;fail('定位被拒絕了。請到手機設定允許瀏覽器使用位置，再試一次。')}
      });
      setTimeout(function(){if(!done){done=true;fail('抓不到定位，請到戶外或窗邊再試一次。')}},20000);
      startGeo();
    });
    var en=document.getElementById('t-end');
    if(en) en.addEventListener('click',function(){
      try{Object.keys(localStorage).forEach(function(k){if(k.indexOf('yizhu-test-')===0||k==='yizhu-walk-test')localStorage.removeItem(k)})}catch(e){}
      location.hash='';location.reload();
    });
  }

  /* ================= 路由 ================= */
  function render(){
    var hsh=(location.hash||'').replace('#',''), html, cur=hsh, after=null;
    document.body.classList.remove('on-map'); thumbSpot=null;
    if(hsh==='walk') hsh='map';
    if(hsh==='test'){html=testPage();after=function(){bindTest();if(TEST&&TEST.lat)startGeo()}}
    else if(hsh==='map'&&myRoute()){html=mapPage();cur='map';after=bindMap}
    else if(hsh.indexOf('spot-')===0&&P[hsh.slice(5)]){var id=hsh.slice(5);html=spot(id);cur='map';after=function(){bindSpot(id)}}
    else if(hsh==='album'&&profile){html=album();after=function(){var b=document.getElementById('retry');if(b)b.addEventListener('click',flush)}}
    else if(hsh==='cards') html=cards();
    else if(TEST&&TEST.lat&&myRoute()){location.hash='map';return}
    else {html=home();cur='';after=bindHome}
    if(hsh==='test')cur='test';
    nav(cur); app.innerHTML=html; window.scrollTo(0,0); if(after) after();
  }
  window.addEventListener('hashchange',render);
  render();
  pollOthers(); setInterval(pollOthers,Math.max(10,S.liveRefresh||30)*1000);
  flush(); updatePending();

  /* ================= 載入動畫 ================= */
  var ld=document.getElementById('loader');
  var wait=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches?300:1800;
  setTimeout(function(){ld.classList.add('out');setTimeout(function(){ld.remove()},500)},wait);
})();
</script>
</body>
